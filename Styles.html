<style>
:root{--bg:#090b12;--panel:#121724;--line:#293144;--txt:#f4f6fb;--muted:#9ca7bb;--orange:#ff7a18;--green:#25d366}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 20% 0,#1a2032 0,transparent 48%),var(--bg);color:var(--txt);font:15px/1.6 system-ui,Arial,sans-serif}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 6%;background:#090b12ed;border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}.brand{font-size:23px;font-weight:900;letter-spacing:1px;color:white;text-decoration:none}.brand span,h2 span{color:var(--orange)}nav{display:flex;gap:18px;flex-wrap:wrap}nav a,footer a{color:var(--muted);text-decoration:none}nav a:hover,footer a:hover{color:var(--orange)}main{max-width:1120px;margin:auto;padding:0 22px}.hero{padding:95px 0 75px;max-width:850px}.hero.compact{padding:45px 0 20px}.hero small{color:var(--orange);font-weight:800;letter-spacing:2px}.hero h1{font-size:clamp(40px,7vw,76px);line-height:1.04;margin:14px 0}.hero h1 span{color:var(--orange)}.hero p,section p{color:var(--muted)}section{padding:35px 0;scroll-margin-top:90px}h2{font-size:30px;margin:0 0 10px}.btn,button{border:0;border-radius:10px;padding:12px 18px;background:var(--orange);color:#130c07;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:#283145;color:white}form{max-width:720px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}input,select,textarea{width:100%;padding:13px;border-radius:9px;border:1px solid var(--line);background:#0b0f19;color:var(--txt);font:inherit}textarea{min-height:90px;resize:vertical}form button,form textarea{grid-column:1/-1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.item{padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--pane
